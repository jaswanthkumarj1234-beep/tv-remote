<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>TV Remote</title>
<style>
  :root{--bg:#000;--fg:#fff;--dim:#777;--line:#222;--panel:#0b0b0b;--accent:#ff7a00}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0 auto;padding:18px 16px 28px;max-width:440px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin:0}
  h1 span{color:var(--accent)}
  #status{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  #status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
  #status.ok{color:var(--fg)}
  #status.ok::before{background:var(--accent)}
  #status.bad{color:var(--accent)}
  #status.bad::before{background:var(--accent)}
  .row{display:flex;gap:8px;margin-bottom:12px}
  input{flex:1;min-width:0;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:16px;outline:none}
  input:focus{border-color:var(--accent)}
  input::placeholder{color:#555}
  button{padding:14px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:14px;letter-spacing:.04em;flex:1}
  button:active{background:var(--accent);border-color:var(--accent);color:#000}
  button:disabled{opacity:.4}
  #saveCode{flex:0 0 auto;padding:13px 18px}
  #pad{height:210px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
       color:#555;touch-action:none;user-select:none;margin-bottom:14px;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;line-height:1.9}
  #pad.on{border-color:var(--accent)}
  .dpad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .dpad button{height:58px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .ok{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
  .ok:active{background:#fff;border-color:#fff}
  #heard{font-size:13px;color:var(--dim);min-height:20px;margin-top:2px}
  .label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:6px 0 8px}
</style>
</head>
<body>
<header>
  <h1>TV <span>Remote</span></h1>
  <div id="status">Connecting</div>
</header>

<div class="label">Pairing code</div>
<div class="row">
  <input id="code" placeholder="6-digit code on TV" inputmode="numeric" maxlength="6">
  <button id="saveCode">Save</button>
</div>

<div class="label">Touchpad</div>
<div id="pad">Tap = select<br>Swipe = move / scroll</div>

<div class="dpad">
  <span></span><button data-dpad="up">&#9650;</button><span></span>
  <button data-dpad="left">&#9664;</button><button data-dpad="ok" class="ok">OK</button><button data-dpad="right">&#9654;</button>
  <span></span><button data-dpad="down">&#9660;</button><span></span>
</div>

<div class="grid">
  <button data-key="back">Back</button>
  <button data-key="home">Home</button>
  <button data-key="recents">Recents</button>
  <button data-vol="down">Vol &minus;</button>
  <button data-vol="mute">Mute</button>
  <button data-vol="up">Vol +</button>
</div>

<div class="label">Type</div>
<div class="row">
  <input id="text" placeholder="Type here, then Send">
  <button id="sendText" style="flex:0 0 auto;padding:13px 18px">Send</button>
</div>

<div class="row"><button id="mic">Speak</button></div>
<div id="heard"></div>

<script>
const $ = s => document.querySelector(s);
let code = localStorage.getItem('tvRemoteCode') || '';
$('#code').value = code;

function setStatus(msg, ok) {
  const el = $('#status');
  el.textContent = msg;
  el.className = ok === undefined ? '' : ok ? 'ok' : 'bad';
}

async function send(cmd) {
  if (!code) { setStatus('Enter the code from your TV', false); return false; }
  try {
    const r = await fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Pair-Code': code },
      body: JSON.stringify(cmd)
    });
    if (r.status === 401) { setStatus('Wrong code', false); return false; }
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { setStatus('TV could not do that. Is accessibility on?', false); return false; }
    setStatus('Connected', true);
    return true;
  } catch (e) {
    setStatus('Cannot reach TV. Same Wi-Fi?', false);
    return false;
  }
}

// Initial reachability check
fetch('/api/status').then(r => r.json()).then(j => setStatus(j.name || 'TV found', true))
  .catch(() => setStatus('Cannot reach TV', false));

$('#saveCode').onclick = () => {
  code = $('#code').value.trim();
  localStorage.setItem('tvRemoteCode', code);
  setStatus('Code saved', true);
};

// D-pad and OK
document.querySelectorAll('[data-dpad]').forEach(b => {
  b.onclick = () => send({ type: 'dpad', dir: b.dataset.dpad });
});

// Back / Home / Recents
document.querySelectorAll('[data-key]').forEach(b => {
  b.onclick = () => send({ type: 'key', name: b.dataset.key });
});

// Volume
document.querySelectorAll('[data-vol]').forEach(b => {
  b.onclick = () => send({ type: 'volume', dir: b.dataset.vol });
});

// Touchpad: a tap selects, a swipe moves focus or scrolls on the TV
const pad = $('#pad');
let sx = 0, sy = 0, st = 0, moved = 0;
pad.addEventListener('touchstart', e => {
  const t = e.touches[0];
  sx = t.clientX; sy = t.clientY; st = Date.now(); moved = 0;
  pad.classList.add('on');
  e.preventDefault();
}, { passive: false });
pad.addEventListener('touchmove', e => {
  const t = e.touches[0];
  moved = Math.max(moved, Math.hypot(t.clientX - sx, t.clientY - sy));
  e.preventDefault();
}, { passive: false });
pad.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  pad.classList.remove('on');
  if (moved < 10 && Date.now() - st < 400) {
    send({ type: 'tap' });
  } else if (Math.abs(dx) > Math.abs(dy)) {
    send({ type: 'swipe', dir: dx > 0 ? 'right' : 'left', distance: Math.min(600, Math.abs(dx) * 3) });
  } else {
    send({ type: 'swipe', dir: dy > 0 ? 'down' : 'up', distance: Math.min(600, Math.abs(dy) * 3) });
  }
  e.preventDefault();
}, { passive: false });

// Typing: the phone text box is the source of truth; Send replaces the TV field's text
$('#sendText').onclick = async () => {
  const v = $('#text').value;
  if (!v) return;
  if (await send({ type: 'text', value: v, append: false })) $('#text').value = '';
};

// Voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $('#mic').disabled = true;
  $('#mic').textContent = 'Voice not supported here';
} else {
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => {
    const said = e.results[0][0].transcript.trim();
    $('#heard').textContent = 'Heard: ' + said;
    handleVoice(said);
  };
  rec.onerror = e => { $('#heard').textContent = 'Voice error: ' + e.error + ' (you can also use your keyboard mic)'; };
  $('#mic').onclick = () => { $('#heard').textContent = 'Listening...'; rec.start(); };
}

function handleVoice(s) {
  const t = s.toLowerCase();
  if (t === 'back' || t === 'go back') return send({ type: 'key', name: 'back' });
  if (t === 'home' || t === 'go home') return send({ type: 'key', name: 'home' });
  if (t === 'recents' || t === 'recent apps') return send({ type: 'key', name: 'recents' });
  if (t === 'volume up' || t === 'louder') return send({ type: 'volume', dir: 'up' });
  if (t === 'volume down' || t === 'quieter') return send({ type: 'volume', dir: 'down' });
  if (t === 'mute') return send({ type: 'volume', dir: 'mute' });
  if (t === 'select' || t === 'ok' || t === 'click') return send({ type: 'dpad', dir: 'ok' });
  if (t === 'scroll down') return send({ type: 'swipe', dir: 'up', distance: 500 });
  if (t === 'scroll up') return send({ type: 'swipe', dir: 'down', distance: 500 });
  // Anything else goes into the text box so you can check it and tap Send
  $('#text').value = s.replace(/^(type|search for|search)\s+/i, '');
  $('#heard').textContent += '  (put in the text box, tap Send)';
}
</script>
</body>
</html>
