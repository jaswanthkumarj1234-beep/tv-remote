name: Build TV Remote APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: tv-app
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp tv-app/app/build/outputs/apk/debug/app-debug.apk tv-remote.apk

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-remote-apk
          path: tv-remote.apk

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tv-remote.apk
